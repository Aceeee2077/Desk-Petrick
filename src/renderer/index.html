<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' data:; worker-src 'self' blob:"
  />
  <title>Petric</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 3D model canvas (behind the 2D canvas; only used in custom 3D model mode) -->
  <canvas id="pet3d-canvas" width="300" height="300"></canvas>

  <!-- 300x300 transparent 2D canvas: sprite animation + eye tracking + Zzz / shadow -->
  <canvas id="pet-canvas" width="300" height="300"></canvas>

  <!-- Speech bubble (the little tail pointing at the pet is drawn with CSS ::after) -->
  <div id="bubble"></div>

  <!-- Affinity hearts badge (top-right; purely visual, pointer-events: none) -->
  <div id="affinity-badge"></div>

  <!-- AI chat console (triggered by double-clicking the pet / right-click menu) -->
  <div id="chat-ui" class="hidden">
    <!-- Latest AI reply renders INSIDE the console so it can never be covered by the input -->
    <div id="chat-reply" class="hidden"></div>
    <div class="chat-row">
      <button id="chat-history-btn" class="chat-icon-btn" title="聊天记录">🕘</button>
      <input
        id="chat-input"
        type="text"
        maxlength="200"
        placeholder="和宠物说点什么…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="chat-send">发送</button>
    </div>
  </div>

  <!-- Chat history overlay (toggled by the 🕘 button) -->
  <div id="chat-history" class="hidden">
    <div class="chat-history-head">
      <span data-i18n="chat.historyTitle">📜 聊天记录</span>
      <button id="chat-history-close" class="chat-icon-btn">✕</button>
    </div>
    <div id="chat-history-list"></div>
  </div>

  <!-- Vendored three.js UMD build (MIT) + GLTFLoader, then app scripts -->
  <script src="../assets/vendor/three.min.js"></script>
  <script src="../assets/vendor/GLTFLoader.js"></script>
  <script src="./i18n.js"></script>
  <script src="./pet3d.js"></script>
  <script src="./app.js"></script>
</body>
</html>
