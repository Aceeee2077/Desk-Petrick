<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
  />
  <title>和 Petric 对话</title>
  <link rel="stylesheet" href="./chat.css" />
</head>
<body>
  <div class="panel">
    <!-- Drag region (-webkit-app-region: drag) -->
    <header class="drag">
      <span class="brand" id="brand-avatar">🐾</span>
      <div class="head-title" id="head-title"></div>
      <div class="head-actions no-drag">
        <button id="btn-header-archive" class="head-btn" title="">🗂</button>
        <button id="btn-header-delete" class="head-btn" title="">🗑</button>
        <button id="btn-close" class="head-btn" title="">✕</button>
      </div>
    </header>

    <div class="layout">
      <!-- Left: ChatGPT-style conversation sidebar -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <button id="btn-new-chat"></button>
        </div>
        <div id="conv-list" class="conv-scroll"></div>
        <div class="archived-block">
          <button id="archived-toggle"></button>
          <div id="archived-list" class="conv-scroll collapsed"></div>
        </div>
      </aside>

      <!-- Right: messages + composer -->
      <main class="chat-main">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea
            id="chat-input"
            rows="1"
            placeholder=""
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button id="chat-send"></button>
        </div>
      </main>
    </div>
  </div>

  <script src="./i18n.js"></script>
  <script src="./chat.js"></script>
</body>
</html>
