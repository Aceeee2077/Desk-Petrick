name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign & publish (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Verify the signing key + password in seconds instead of waiting for a full
      # build. A bad/missing secret is surfaced as an annotation with the reason.
      - name: Verify signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is empty or not set"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty or not set"
            exit 1
          fi
          echo "::notice::private key secret length: ${#TAURI_SIGNING_PRIVATE_KEY} (the key file is 348)"
          echo "::notice::password secret length: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          set +e
          echo "preflight" > "$RUNNER_TEMP/preflight.txt"
          out=$(npm exec tauri signer sign "$RUNNER_TEMP/preflight.txt" </dev/null 2>&1)
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "$out"
            echo "$out" | tail -n 5 | while IFS= read -r line; do
              echo "::error::signing key check: $line"
            done
            exit 1
          fi
          echo "Signing key is valid."

      # tauri-action reads version/identifier from src-tauri/tauri.conf.json and
      # builds the frontend via beforeBuildCommand, so no separate npm build here.
      # It signs the installer and publishes latest.json + .sig automatically
      # using the private key from the repository secret.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Prismoo v__VERSION__'
          releaseBody: 'Windows installer. Auto-update is available from v0.5.1 onwards.'
          releaseDraft: false
          prerelease: false
