name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are handy for testing the pipeline without cutting a version.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: '--bundles dmg'
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            args: '--bundles appimage,deb'
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri links against the system webkit on Linux; the Windows and macOS
      # runners already ship WebView2 / WebKit.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # `tauri build` runs the front-end build itself (see beforeBuildCommand in
      # src-tauri/tauri.conf.json), so no separate `npm run build` is needed.
      - name: Build the installer
        run: npx tauri build ${{ matrix.args }}

      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          # Drafted on purpose: notes and the pre-release flag are reviewed by hand.
          draft: true
          prerelease: true
          name: Prismoo ${{ github.ref_name }}
          files: ${{ matrix.files }}
