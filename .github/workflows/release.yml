name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist-script: dist:win
          - os: macos-latest
            dist-script: dist:mac
          - os: ubuntu-latest
            dist-script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Code-signing secrets are optional. electron-builder 25 treats an *empty*
      # CSC_LINK as "use the certificate at this path" (it only skips signing when
      # the variable is unset), and GitHub Actions exports unset secrets as empty
      # strings — which made the macOS build fail with "<repo> not a file".
      # Export each variable only when the secret is actually configured, so
      # unsigned builds run without a CSC_LINK in the environment at all.
      - name: Prepare code-signing environment
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"; fi
          if [ -n "$CSC_KEY_PASSWORD" ]; then echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$WIN_CSC_LINK" ]; then echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"; fi
          if [ -n "$WIN_CSC_KEY_PASSWORD" ]; then echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_ID" ]; then echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"; fi
          # Never auto-discover a keychain identity on CI runners.
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Build and publish release assets
        run: npm run ${{ matrix.dist-script }} -- --publish always
        env:
          # electron-builder uses this token to attach assets to the pushed tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
