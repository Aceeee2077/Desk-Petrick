[package]
name = "prismoo"
version = "0.5.0"
description = "Prismoo · cross-platform desktop pet"
authors = ["Prismoo Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prismoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
