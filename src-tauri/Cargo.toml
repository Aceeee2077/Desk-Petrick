[package]
name = "prismoo"
version = "0.5.0"
description = "Prismoo · cross-platform desktop pet"
authors = ["Prismoo Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prismoo_lib"
# Desktop-only: the Tauri template also lists staticlib/cdylib for iOS/Android,
# which makes MSVC emit .lib/.exp byproducts and the `linker_messages` warning.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
