# appId is kept stable from the Petric era so installers recognize an existing
# install and upgrade it in place during the rebrand (visible name is Prismoo).
appId: com.petric.desktop-pet
productName: Prismoo
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
  - "!**/*.map"
  - "!**/*.ts"
asar: true
asarUnpack:
  - node_modules/onnxruntime-node/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
compression: normal

# Auto-update source: the app (electron-updater) reads this at runtime and checks the
# public GitHub Releases of this repo for newer versions.
publish:
  provider: github
  owner: Aceeee2077
  repo: Desk-Petrick
  releaseType: release

win:
  files:
    - dist/**/*
    - package.json
    - THIRD_PARTY_NOTICES.md
    - "!**/*.map"
    - "!**/*.ts"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
  # Keep the installer file name identical to the one electron-updater writes into
  # latest.yml (no spaces / localized names), otherwise auto-update downloads 404.
  artifactName: Prismoo-Setup-${version}.${ext}
  target:
    - nsis
  icon: src/assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Prismoo

mac:
  files:
    - dist/**/*
    - package.json
    - THIRD_PARTY_NOTICES.md
    - "!**/*.map"
    - "!**/*.ts"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
  target:
    - dmg
    - zip
  icon: src/assets/icon.icns
  category: public.app-category.entertainment
  darkModeSupport: true

linux:
  files:
    - dist/**/*
    - package.json
    - THIRD_PARTY_NOTICES.md
    - "!**/*.map"
    - "!**/*.ts"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*"
  target:
    - AppImage
    - deb
  icon: src/assets/icon.png
  category: Utility
  maintainer: Prismoo Contributors
